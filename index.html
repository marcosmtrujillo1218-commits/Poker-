function newHand(){
 if(S.stack[0]<=0||R().slice(1).every(i=>S.stack[i]<=0))S.stack=Array(S.n).fill(1000);
 const out=S.stack.map(x=>x<=0);G={out,d:mkDeck(),hole:R().map(()=>[]),board:[],bet:Z(),tot:Z(),fold:Fa(),acted:Fa(),say:R().map(()=>''),street:0,last:BB,fly:[],over:false,show:false,msg:''};
 R().forEach(i=>{if(!out[i])G.hole[i]=[G.d.pop(),G.d.pop()]});
 S.dealer=nxt(S.dealer,i=>!out[i]);
 const n=out.filter(x=>!x).length,sb=n==2?S.dealer:nxt(S.dealer,i=>!out[i]),bb=nxt(sb,i=>!out[i]);
 put(sb,SB());put(bb,BB);G.fly=[sb,bb];G.to=n==2?sb:nxt(bb,i=>!out[i]);
 if(!canAct(G.to))G.to=nxt(G.to,canAct);dealHole();render();next()}
function next(){const g=G;if(!G.over&&G.to>0)setTimeout(function f(){if(g!==G)return;if(G.hold)return setTimeout(f,250);botMove()},700+Math.random()*600)}
function act(p,type,to){
 const mx=mxb(),call=Math.min(mx-G.bet[p],S.stack[p]);
 if(type=='f'){G.fold[p]=true;G.say[p]='Retirado'}
 else if(type=='c'){put(p,call);G.acted[p]=true;if(call)G.fly.push(p);G.say[p]=call?(S.stack[p]?'Iguala '+usd(call):'All-in'):'Pasa'}
 else{const cap=G.bet[p]+S.stack[p];to=Math.max(Math.min(to,cap),Math.min(mx+G.last,cap));G.last=Math.max(G.last,to-mx);put(p,to-G.bet[p]);G.fly.push(p);
  G.acted=G.acted.map((a,i)=>i==p);G.say[p]=S.stack[p]?'Sube a '+usd(to):'All-in '+usd(to)}
 const al=R().filter(inHand);
 if(al.length==1)return win1(al[0]);
 const m=mxb(),ca=al.filter(i=>S.stack[i]>0);
 const done=ca.every(i=>G.bet[i]==m&&G.acted[i])||(ca.length<=1&&(!ca.length||G.bet[ca[0]]>=m));
 if(done)return endRound();
 G.to=nxt(p,canAct);render();next()}
function endRound(){
 G.bet=Z();G.acted=Fa();G.last=BB;G.say=G.say.map((s,i)=>G.fold[i]?'Retirado':'');
 if(G.street==3){G.to=-1;return showdown()}
 const ca=R().filter(canAct);
 if(ca.length<=1){G.show=true;G.to=-1;render();const g=G,step=()=>{if(g!==G)return;if(G.street<3){deal();render();setTimeout(step,1000)}else showdown()};return setTimeout(step,1100)}
 deal();G.to=nxt(S.dealer,canAct);render();next()}
function deal(){G.street++;G.d.pop();const n=G.street==1?3:1;for(let i=0;i<n;i++)G.board.push(G.d.pop());G.nh=n;G.fx=[];for(let i=0;i<n;i++)G.fx.push(['.board .card:nth-child('+(G.board.length-n+i+1)+')',i*150]);holdFor(n*150+650)}
function win1(w){const t=potN();S.stack[w]+=t;G.bet=Z();finish((w?NMS[w]+' gana ':'Ganas ')+usd(t)+': todos se retiraron.')}
function showdown(){
 G.show=true;const al=R().filter(inHand),v=Z(),won=Z();al.forEach(i=>{v[i]=best(G.hole[i].concat(G.board));G.say[i]=NM[Math.floor(v[i]/K)]});
 const lv=[...new Set(al.map(i=>G.tot[i]))].sort((a,b)=>a-b);let prev=0;
 for(const Lv of lv){let amt=0;for(let i=0;i<S.n;i++)amt+=Math.max(0,Math.min(G.tot[i],Lv)-prev);
  const el=al.filter(i=>G.tot[i]>=Lv),mv=Math.max(...el.map(i=>v[i])),ws=el.filter(i=>v[i]==mv);
  ws.forEach((w,k)=>{const sh=Math.floor(amt/ws.length)+(k<amt%ws.length?1:0);S.stack[w]+=sh;won[w]+=sh});prev=Lv}
 G.bet=Z();
 finish(R().filter(i=>won[i]>0).map(i=>(i?NMS[i]+' gana ':'Ganas ')+usd(won[i])+' con '+NM[Math.floor(v[i]/K)].toLowerCase()).join('. ')+'.')}
function finish(r){
 G.over=true;G.to=-1;
 if(S.stack[0]<=0)r+=' Te quedaste sin fichas.';else if(R().slice(1).every(i=>S.stack[i]<=0))r+=' ¡Ganaste la partida!';
 G.msg=r;render()}
function strength(p){
 const h=G.hole[p],b=G.board,hr=h.map(x=>x.r);
 if(!b.length){const a=Math.max(...hr),c=Math.min(...hr);if(a==c)return .5+a/28;let s=(a+c)/56+.1;if(h[0].s==h[1].s)s+=.05;if(a-c<=2)s+=.04;if(a>=12)s+=.08;return s}
 const all=h.concat(b),v=best(all),cat=Math.floor(v/K);
 let s=[.2,.5,.7,.82,.88,.92,.96,.99,1][cat];
 if(cat==0)s=.1+Math.max(...hr)/100;
 if(cat==1){const n={};all.forEach(x=>n[x.r]=(n[x.r]||0)+1);const pr=+Object.keys(n).find(k=>n[k]==2);s=hr.includes(pr)?(pr>=Math.max(...b.map(x=>x.r))?.62:.5):.22}
 if(cat<=2&&b.length<5)for(let q=0;q<4;q++)if(all.filter(x=>x.s==q).length>=4&&h.some(x=>x.s==q))s+=.15;
 return Math.min(s,1)}
function botMove(){
 const p=G.to;if(G.over||p<1)return;
 const opp=R().filter(i=>i!=p&&inHand(i)).length,ag=AG[p],D=[{n:.3,m:-.1,r:.5,b:.02,z:.3},{n:.1,m:.08,r:1,b:.05,z:.5},{n:.03,m:.05,r:1.25,b:.1,z:.65}][CFG.df[p]??1],s=strength(p)-.03*(opp-1)+(Math.random()-.5)*2*D.n;
 const mx=mxb(),call=Math.min(mx-G.bet[p],S.stack[p]),pot=potN(),r=Math.random();
 const canR=S.stack[p]>call&&R().some(i=>i!=p&&canAct(i));
 const size=f=>Math.round(mx+Math.max(G.last,f*(pot+call)));
 if(call==0){if(canR&&((s>.65&&r<.7*ag*D.r)||r<D.b*ag||(s>.45&&r<.16*ag*D.r)))act(p,'r',size(D.z+.4*Math.random()));else act(p,'c')}
 else{const odds=call/(pot+call);
  if(s>.85&&canR&&r<.5*ag*D.r)act(p,'r',size(.6+D.z/2));
  else if(s>odds+D.m||s>.7||(r<D.b*ag&&s>.25)||(call<=BB&&s>.3))act(p,'c');
  else act(p,'f')}}

 $('bl').textContent='ciegas '+usd(SB())+'/'+usd(BB);const f=G.fly||[];G.fly=[];f.forEach((p,k)=>flyChips(p,k*160));const q=G.fx||[];G.fx=[];q.forEach(([s,d])=>flyCard(s,d))}
