function flyCard(sel,dl){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;

 if(!d||!t)return;

function e5(c){
 const r=c.map(x=>x.r).sort((a,b)=>b-a),fl=c.every(x=>x.s==c[0].s),u=new Set(r);
 let st=0;if(u.size==5){if(r[0]-r[4]==4)st=r[0];else if(r[0]==14&&r[1]==5)st=5}

 else if(g[0][1]==2&&g[1][1]==2){cat=2;k=ks}else if(g[0][1]==2){cat=1;k=ks}else{cat=0;k=r}

function strength(p){
 const h=G.hole[p],b=G.board,hr=h.map(x=>x.r);
 if(!b.length){const a=Math.max(...hr),c=Math.min(...hr);if(a==c)return .5+a/28;let s=(a+c)/56+.1;if(h[0].s==h[1].s)s+=.05;if(a-c<=2)s+=.04;if(a>=12)s+=.08;return s}
 const all=h.concat(b),v=best(all),cat=Math.floor(v/K);
 let s=[.2,.5,.7,.82,.88,.92,.96,.99,1][cat];
 if(cat==0)s=.1+Math.max(...hr)/100;
 if(cat==1){const n={};all.forEach(x=>n[x.r]=(n[x.r]||0)+1);const pr=+Object.keys(n).find(k=>n[k]==2);s=hr.includes(pr)?(pr>=Math.max(...b.map(x=>x.r))?.62:.5):.22}
